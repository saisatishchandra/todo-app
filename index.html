<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="./styles.css" rel="stylesheet">
</head>
<body>
    <div class="cont">
     
      <div class="card app-card shadow-lg">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <h1 class="app-title me-auto mb-0"><i class="fa-solid fa-list-check me-2"></i>Todo</h1>
            <small class="text-muted">Organize your day</small>
          </div>

        
          <form name="taskForm" onsubmit="addTask(event);" class="d-flex gap-2 align-items-center mb-3 flex-wrap">
            <div class="input-group input-group-sm flex-fill">
              <span class="input-group-text"><i class="fa-regular fa-pen-to-square"></i></span>
              <input type="text" name="task" class="form-control" placeholder="What do you want to do?" aria-label="task">
            </div>
            <div class="input-group input-group-sm" style="width:170px">
              <span class="input-group-text"><i class="fa-regular fa-clock"></i></span>
              <input type="text" name="time" class="form-control" placeholder="Due (e.g. 5pm)" aria-label="time">
            </div>
            <input type="submit" value="Add Task" class="btn btn-primary btn-sm py-2 px-3">
          </form>

          
          <div id="todos" class="llis list-group list-group-flush">
            
          </div>

        
          <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel">Edit task and times</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <input type="text" id="task" class="form-control mb-2" placeholder="Task">
                  <input type="text" id="time" class="form-control" placeholder="Time">
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="savec()">Save changes</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
